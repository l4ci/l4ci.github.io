{% include rota/icons.svg %}
<figure class="round-demo" aria-labelledby="round-title" aria-describedby="round-caption" data-round-demo>
  <div class="round-demo-heading">
    <span id="round-title">An example round</span><span class="round-count">One project · separate sessions and accounts</span>
  </div>
  <div class="round-map">
    <svg class="round-wires" aria-hidden="true" focusable="false">
      <defs>
        <marker id="wire-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7"/></marker>
        <marker id="wire-arrow-active" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7"/></marker>
      </defs>
      <g data-wire="worker-12"><path class="wire-track"/><path class="wire-motion"/></g>
      <g data-wire="worker-13"><path class="wire-track"/><path class="wire-motion"/></g>
      <g data-wire="worker-14"><path class="wire-track"/><path class="wire-motion"/></g>
      <g data-wire="human"><path class="wire-track"/><path class="wire-motion"/></g>
      <g data-wire="gate-12"><path class="wire-track"/><path class="wire-motion"/></g>
      <g data-wire="gate-13"><path class="wire-track"/><path class="wire-motion"/></g>
      <g data-wire="gate-14"><path class="wire-track"/><path class="wire-motion"/></g>
    </svg>
  <div class="round-intake">
    <div class="round-node round-you" data-node="you" data-status="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M5 21v-3a7 7 0 0 1 14 0v3"/></svg>
      <div><strong>YOU</strong><span data-you-status>Describe the work</span></div>
    </div>
    <span class="intake-link" data-intake-link="backlog" aria-hidden="true">→</span>
    <div class="round-node" data-node="backlog" data-status="waiting"><div><strong>Backlog</strong><span>Issues #12 · #13 · #14</span></div></div>
    <span class="intake-link" data-intake-link="orchestrator" aria-hidden="true">→</span>
    <div class="round-node round-orchestrator" data-node="orchestrator" data-status="waiting">
      <svg class="harness-mark" aria-hidden="true"><use href="#i-claude"/></svg>
      <div><strong>Orchestrator</strong><span>Your Claude Code session</span><code>/rota-orchestrate</code><span class="orchestrator-duty" data-orchestrator-duty>Spawns workers · runs merge gates</span></div>
    </div>
  </div>
  <div class="round-spawn"><span>One issue per worker · separate worktrees</span></div>
  <div class="round-lanes">
    <div class="round-columns" aria-hidden="true"><span>Worker sessions</span><span>PR</span><span>Reviews</span><span>Merge gate<small>Run by orchestrator</small></span></div>
    <div class="round-lane" role="group" aria-label="Issue 12" data-issue="12" data-state="queued">
      <div class="round-session" role="group" aria-label="Worker session" data-stage="work" data-status="waiting">
        <svg class="harness-mark" aria-hidden="true"><use href="#i-claude"/></svg>
        <div class="session-copy"><strong>Issue #12</strong><span>Claude Code <span data-session-account>· Account A</span></span><span class="session-worktree">worktree /issue-12</span></div>
        <span class="session-status" data-session-status>Queued</span>
      </div>
      <span class="round-link" data-link="pr" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Pull request" data-stage="pr" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">PR</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="review" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Reviews" data-stage="review" data-status="waiting"><span class="stage-mark" aria-hidden="true"><svg class="review-return-mark" viewBox="0 0 16 16"><path d="m6 3-3 3 3 3M3 6h6a4 4 0 0 1 0 8H7"/></svg></span><span class="stage-name">Reviews</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="gate" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Merge gate" data-stage="gate" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">Merge gate</span><span class="stage-status">Waiting</span></div>
      <div class="round-return" aria-hidden="true"><svg viewBox="0 0 400 26" preserveAspectRatio="none" aria-hidden="true"><path d="M390 1V9Q390 18 380 18H20Q10 18 10 9V1"/><path d="m5 7 5-6 5 6"/></svg><span>Review feedback → fresh Claude session</span></div>
    </div>
    <div class="round-lane" role="group" aria-label="Issue 13" data-issue="13" data-state="queued">
      <div class="round-session" role="group" aria-label="Worker session" data-stage="work" data-status="waiting">
        <svg class="harness-mark" aria-hidden="true"><use href="#i-openai"/></svg>
        <div class="session-copy"><strong>Issue #13</strong><span>Codex <span data-session-account>· Account B</span></span><span class="session-worktree">worktree /issue-13</span></div>
        <span class="session-status" data-session-status>Queued</span>
      </div>
      <span class="round-link" data-link="pr" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Pull request" data-stage="pr" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">PR</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="review" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Reviews" data-stage="review" data-status="waiting"><span class="stage-mark" aria-hidden="true"><svg class="review-return-mark" viewBox="0 0 16 16"><path d="m6 3-3 3 3 3M3 6h6a4 4 0 0 1 0 8H7"/></svg></span><span class="stage-name">Reviews</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="gate" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Merge gate" data-stage="gate" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">Merge gate</span><span class="stage-status">Waiting</span></div>
    </div>
    <div class="round-lane" role="group" aria-label="Issue 14" data-issue="14" data-state="queued">
      <div class="round-session" role="group" aria-label="Worker session" data-stage="work" data-status="waiting">
        <svg class="harness-mark" aria-hidden="true"><use href="#i-opencode"/></svg>
        <div class="session-copy"><strong>Issue #14</strong><span>OpenCode <span data-session-account>· Account C</span></span><span class="session-worktree">worktree /issue-14</span></div>
        <span class="session-status" data-session-status>Queued</span>
      </div>
      <span class="round-link" data-link="pr" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Pull request" data-stage="pr" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">PR</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="review" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Reviews" data-stage="review" data-status="waiting"><span class="stage-mark" aria-hidden="true"><svg class="review-return-mark" viewBox="0 0 16 16"><path d="m6 3-3 3 3 3M3 6h6a4 4 0 0 1 0 8H7"/></svg></span><span class="stage-name">Reviews</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="gate" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Merge gate" data-stage="gate" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">Merge gate</span><span class="stage-status">Waiting</span></div>
    </div>
  </div>
  </div>
  <div class="round-outcome">
    <span class="round-gate-note">Orchestrator runs the gate: reviews + tests on current main</span>
    <div class="round-delivery"><span data-main-status>main · 0/3 merged</span><span aria-hidden="true">→</span><span class="round-release" data-release="waiting">Release <span data-release-status>On your approval</span></span></div>
  </div>
  <div class="round-message">
    <span class="round-message-route" data-round-route>YOU → Backlog</span>
    <p data-round-event>You describe the work. It becomes three issues in the project backlog.</p>
    <div class="round-example-answer" hidden><span>Try an example answer:</span><button type="button" data-answer="Show all results.">Show all results</button><button type="button" data-answer="Show an empty state.">Show an empty state</button></div>
  </div>
  <div class="round-playback" hidden>
    <div class="round-chapters" role="group" aria-label="Jump to a part of the example round"></div>
    <div class="round-controls"><button type="button" data-round-toggle>Pause</button><button type="button" data-round-next aria-label="Next step in the example round">Next <span aria-hidden="true">→</span></button></div>
  </div>
  <figcaption id="round-caption">You set the scope, answer product questions and approve releases in your agent session. The orchestrator here is your Claude Code session. It starts workers, relays decisions and runs the merge gate.</figcaption>
</figure>
