{% include rota/icons.svg %}
<figure class="round-demo" aria-labelledby="round-title" aria-describedby="round-caption" data-round-demo>
  <div class="round-demo-heading">
    <div class="round-demo-title"><span class="round-coordinator">{% include rota/icon.svg %}<strong>rota</strong></span><span id="round-title">Example round</span></div>
    <span class="round-count">3 issues <span aria-hidden="true">·</span> <span data-round-accounts>3 accounts</span></span>
  </div>
  <div class="round-lanes">
    <div class="round-columns" aria-hidden="true"><span>Worker sessions</span><span>Review</span><span>Tests + main</span><span>Merge</span></div>
    <div class="round-lane" role="group" aria-label="Issue 12" data-issue="12" data-state="building">
      <div class="round-session" role="group" aria-label="Worker session" data-stage="work" data-status="active">
        <svg class="harness-mark" aria-hidden="true"><use href="#i-claude"/></svg>
        <div class="session-copy"><strong>Issue #12</strong><span>Claude Code</span><span class="session-account" data-session-account>Account A</span></div>
        <span class="session-status" data-session-status>Working</span>
      </div>
      <span class="round-link" data-link="review" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Review" data-stage="review" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">Review</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="tests" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Tests with current main" data-stage="tests" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">Tests + main</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="merge" aria-hidden="true"></span>
      <div class="round-stage round-main" role="group" aria-label="Merge" data-stage="merge" data-status="waiting"><svg class="merge-mark" aria-hidden="true"><use href="#i-merge"/></svg><span class="stage-name">Merge</span><span class="stage-status">main</span></div>
      <div class="round-return" data-return><svg viewBox="0 0 400 30" preserveAspectRatio="none" aria-hidden="true"><path d="M390 1V12Q390 22 380 22H20Q10 22 10 12V1"/><path class="return-arrow" d="m5 7 5-6 5 6"/></svg><span data-return-label>Changes requested · fresh session</span></div>
    </div>
    <div class="round-lane" role="group" aria-label="Issue 13" data-issue="13" data-state="building">
      <div class="round-session" role="group" aria-label="Worker session" data-stage="work" data-status="active">
        <svg class="harness-mark" aria-hidden="true"><use href="#i-openai"/></svg>
        <div class="session-copy"><strong>Issue #13</strong><span>Codex</span><span class="session-account" data-session-account>Account B</span></div>
        <span class="session-status" data-session-status>Working</span>
      </div>
      <span class="round-link" data-link="review" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Review" data-stage="review" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">Review</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="tests" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Tests with current main" data-stage="tests" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">Tests + main</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="merge" aria-hidden="true"></span>
      <div class="round-stage round-main" role="group" aria-label="Merge" data-stage="merge" data-status="waiting"><svg class="merge-mark" aria-hidden="true"><use href="#i-merge"/></svg><span class="stage-name">Merge</span><span class="stage-status">main</span></div>
    </div>
    <div class="round-lane" role="group" aria-label="Issue 14" data-issue="14" data-state="building">
      <div class="round-session" role="group" aria-label="Worker session" data-stage="work" data-status="active">
        <svg class="harness-mark" aria-hidden="true"><use href="#i-opencode"/></svg>
        <div class="session-copy"><strong>Issue #14</strong><span>OpenCode</span><span class="session-account" data-session-account>Account C</span></div>
        <span class="session-status" data-session-status>Working</span>
      </div>
      <span class="round-link" data-link="review" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Review" data-stage="review" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">Review</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="tests" aria-hidden="true"></span>
      <div class="round-stage" role="group" aria-label="Tests with current main" data-stage="tests" data-status="waiting"><span class="stage-mark" aria-hidden="true"></span><span class="stage-name">Tests + main</span><span class="stage-status">Waiting</span></div>
      <span class="round-link" data-link="merge" aria-hidden="true"></span>
      <div class="round-stage round-main" role="group" aria-label="Merge" data-stage="merge" data-status="waiting"><svg class="merge-mark" aria-hidden="true"><use href="#i-merge"/></svg><span class="stage-name">Merge</span><span class="stage-status">main</span></div>
    </div>
  </div>
  <div class="round-narration"><span class="round-event-mark" aria-hidden="true"></span><p data-round-event>Three issues start in separate worktrees, using three accounts.</p></div>
  <div class="round-playback" hidden>
    <div class="round-steps" role="group" aria-label="Example round steps"></div>
    <div class="round-controls"><button type="button" data-round-toggle>Pause</button><button type="button" data-round-next aria-label="Next step in the example round">Next <span aria-hidden="true">→</span></button></div>
  </div>
  <figcaption id="round-caption">Example: #12 returns to a fresh Claude session. Each change is reviewed and tested against current main before merging.</figcaption>
</figure>
